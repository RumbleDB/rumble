name: Run QT3 Suite (baseline)

on:
  workflow_dispatch:
  push:
    branches:
      - jimmy/thesis-baseline

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build RumbleDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Build RumbleDB
        run: mvn -B -q clean compile assembly:single
      - uses: actions/upload-artifact@v7
        with:
          name: rumble-build
          path: target
          retention-days: 7

  qt3-jsoniq:
    needs: build
    uses: RumbleDB/rumble-test-suite/.github/workflows/qt3-suite.yml@master
    with:
      tested_parser: jsoniq
      rumble_artifact_name: rumble-build

  qt3-xquery:
    needs: build
    uses: RumbleDB/rumble-test-suite/.github/workflows/qt3-suite.yml@master
    with:
      tested_parser: xquery
      rumble_artifact_name: rumble-build
