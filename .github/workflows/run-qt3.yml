name: Run QT3 Suite

on:
  push:
    branches:
      - master
  pull_request:

env:
  JAVA_VERSION: "17"

jobs:
  resolve-baseline:
    name: Resolve Baseline
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      baseline_run_id: ${{ steps.find-baseline.outputs.baseline_run_id }}
    steps:
      - name: Find baseline run
        id: find-baseline
        uses: actions/github-script@v9
        with:
          script: |
            const isPullRequest = context.eventName === 'pull_request';
            const branch = isPullRequest
              ? context.payload.pull_request.base.ref
              : context.ref.replace('refs/heads/', '');
            const event = isPullRequest && branch !== context.payload.repository.default_branch
              ? 'pull_request'
              : 'push';
            // A push rerun must not compare with a later master run.
            const createdBefore = isPullRequest ? null : Date.parse((await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            })).data.created_at);
            core.setOutput('baseline_run_id', '');

            // Workflow runs are listed newest first. Fetch pages lazily and stop at
            // the first usable baseline, without a search filter or fixed page limit.
            const requiredArtifacts = ['surefire-all-jsoniq', 'surefire-all-xquery'];
            for await (const { data } of github.paginate.iterator(
              github.rest.actions.listWorkflowRuns,
              { ...context.repo, workflow_id: 'run-qt3.yml', per_page: 100 }
            )) {
              const candidates = data.filter((run) => run.id !== context.runId
                && run.head_branch === branch && run.event === event
                && run.head_repository?.id === context.payload.repository.id
                && (isPullRequest || Date.parse(run.created_at) < createdBefore));
              for (const run of candidates) {
                core.info(`Checking run ${run.id} (${run.created_at}, ${run.head_sha}): ${run.status}/${run.conclusion}.`);
                if (run.status !== 'completed' || run.conclusion !== 'success') {
                  continue;
                }
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100
                });
                const available = new Set(artifacts.filter((artifact) => !artifact.expired)
                  .map((artifact) => artifact.name));
                const missing = requiredArtifacts.filter((name) => !available.has(name));
                if (missing.length) {
                  core.info(`Skipping run ${run.id}: missing or expired artifacts: ${missing.join(', ')}.`);
                  continue;
                }
                core.info(`Using latest available baseline: ${run.html_url} (${run.head_sha}, ${run.created_at}).`);
                core.setOutput('baseline_run_id', String(run.id));
                return;
              }
            }
            core.warning(`No successful ${event} baseline with both unexpired artifacts found for ${branch}.`);

  build:
    name: Build RumbleDB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller (RumbleDB)
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build RumbleDB
        run: mvn -B -q clean compile assembly:single

      - name: Upload RumbleDB target
        uses: actions/upload-artifact@v7
        with:
          name: rumble-build
          path: target
          retention-days: 1

  qt3-jsoniq:
    needs: [resolve-baseline, build]
    uses: RumbleDB/rumble-test-suite/.github/workflows/qt3-suite.yml@master
    with:
      tested_parser: jsoniq
      rumble_artifact_name: rumble-build
      baseline_run_id: ${{ needs.resolve-baseline.outputs.baseline_run_id }}

  qt3-xquery:
    needs: [resolve-baseline, build]
    uses: RumbleDB/rumble-test-suite/.github/workflows/qt3-suite.yml@master
    with:
      tested_parser: xquery
      rumble_artifact_name: rumble-build
      baseline_run_id: ${{ needs.resolve-baseline.outputs.baseline_run_id }}

  post-results:
    name: Post Results
    needs: [qt3-jsoniq, qt3-xquery]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Post JSONiq QT3 comment
        uses: mshick/add-pr-comment@v3
        with:
          message-id: qt3-results-jsoniq
          comment-target: ${{ github.event_name == 'pull_request' && 'pr' || 'commit' }}
          message: ${{ needs.qt3-jsoniq.outputs.ci_comment }}

      - name: Post XQuery QT3 comment
        uses: mshick/add-pr-comment@v3
        with:
          message-id: qt3-results-xquery
          comment-target: ${{ github.event_name == 'pull_request' && 'pr' || 'commit' }}
          message: ${{ needs.qt3-xquery.outputs.ci_comment }}
