# Cardinal and ordinal word formatting for fn:format-integer, one job per language.

name: ICU Formatting Languages

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'
jobs:
  formatting-languages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_class: FormattingLanguageTestsEn
            language: English
          - test_class: FormattingLanguageTestsDe
            language: German
          - test_class: FormattingLanguageTestsFr
            language: French
          - test_class: FormattingLanguageTestsIt
            language: Italian
          - test_class: FormattingLanguageTestsEs
            language: Spanish
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Install with Maven
        run: mvn install -DskipTests -Dgpg.skip --quiet
      - name: Report resolved ICU4J version
        run: mvn -q dependency:list -Dincludes=com.ibm.icu:icu4j -DoutputFile=/dev/stdout
      - name: Run ${{ matrix.language }} formatting tests
        run: mvn -Dtest='${{ matrix.test_class }}' test
      - name: Publish Surefire Report ${{ matrix.language }}
        if: always()
        uses: ScalableCapital/action-surefire-report@v2
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          create_check: false
          fail_on_test_failures: false
          fail_if_no_tests: false
          report_mode: workflow
